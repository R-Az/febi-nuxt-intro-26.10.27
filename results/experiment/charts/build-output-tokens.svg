  .label { fill: var(--ink2); font-size: 12px; } .value { fill: var(--ink); font-size: 12px; font-variant-numeric: tabular-nums; }
  .foot { fill: var(--muted); font-size: 11px; } g:hover path { opacity: .8; }
</style>
