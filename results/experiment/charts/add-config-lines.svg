<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 242" width="640" height="242" role="img" aria-label="設定・つなぎ込みの追加行数（2段目（機能を足す））">
<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781; --nuxt:#2a78d6; --next:#eb6834; font-family: system-ui, sans-serif; }
