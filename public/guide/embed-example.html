<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Embed example</title>
<style>
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font: 600 2.5rem/1.3 system-ui, sans-serif; color: #f8f8f2;
    background: radial-gradient(circle at 30% 30%, #44475a, #282a36);
  }
  p { margin: 0; text-align: center; }
  small { display: block; font-size: 1.2rem; font-weight: 400; color: #8be9fd; }
  button {
    margin-top: 1.5rem; padding: 0.6rem 1.4rem; font: inherit; font-size: 1.2rem;
    color: #282a36; background: #bd93f9; border: 0; border-radius: 0.5rem; cursor: pointer;
  }
</style>
</head>
<body>
  <p>
    public/embed-example.html
    <small>served from the deck's base path</small>
    <button onclick="this.textContent = 'Clicked ' + (++window.n || (window.n = 1)) + '×'">Click me</button>
  </p>
</body>
</html>
